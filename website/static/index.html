<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- jQuery Link-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- CSS Link-->
    <link href = "css/main.css" rel = "stylesheet">
    <link href = "css/index.css" rel = "stylesheet">
    <!-- Link to JavaScript for form submission-->
    <script src = "scripts/main.js"></script>
    <title>Home Page</title>
</head>
<body>
    <header>
        <div>
            <h1 style="font-family: 'Caveat', sans-serif;">Text Verifier</h1>
        </div>
        <div id="navbar-placeholder"></div>
    </header>
    <main>
        <div class="form-container">
            <form>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">See if your text is legitimate</label>
                    <textarea class="form-control" placeholder = "Enter Text to Parse here..." id="exampleFormControlTextarea1" rows="10"></textarea>
                  </div>
                <button type="submit" class="btn btn-light">Analyze Text</button>
            </form>
        </div>
    </main>
    <script>
        $(document).ready(()=>{$("#navbar-placeholder").load("navbar.html")});
    </script>
    <!-- Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
